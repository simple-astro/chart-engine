[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-engine"
version = "0.1.0"
description = "Vedic (Jyotisa) chart computation service built on Swiss Ephemeris"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "pyswisseph==2.10.3.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app", "core"]


[tool.pytest.ini_options]
testpaths = ["tests"]
