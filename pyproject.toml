[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-engine"
version = "0.1.0"
description = "Vedic (Jyotisa) chart computation service built on Swiss Ephemeris"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "pyswisseph==2.10.3.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # The IANA database as a Python package, with the old alias names (Asia/Calcutta, which Android still
    # reports). The slim Debian image keeps aliases in the separate tzdata-legacy package, so without this
    # those visitors got "No time zone found with key Asia/Calcutta".
    "tzdata>=2024.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app", "app.remedies", "core"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.js", "static/*.svg", "static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
